<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi d'activité à distance — ESP-GS</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#2a313c;
    --ink:#e6edf3; --ink-dim:#8b949e; --gold:#d4a747; --green:#3fb950;
    --red:#f85149; --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--panel);}
  header h1{font-size:15px;margin:0;font-weight:600;}
  header h1 span{color:var(--gold);}
  #app{max-width:720px;margin:0 auto;padding:20px;}
  .hidden{display:none !important;}
  #loginBox{max-width:360px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;}
  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px;margin-top:14px;}
  input{width:100%;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--ink);font-family:var(--sans);font-size:14px;}
  input:focus{outline:none;border-color:var(--gold);}
  button{cursor:pointer;border:none;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:600;font-family:var(--sans);}
  .btn-gold{background:var(--gold);color:#1a1300;width:100%;margin-top:16px;}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
  .biz-name{font-size:20px;font-weight:700;margin:0;}
  .biz-status{font-size:12.5px;color:var(--ink-dim);margin-top:4px;}
  .period-switch{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap;}
  .period-switch button{background:var(--panel2);color:var(--ink-dim);border:1px solid var(--border);}
  .period-switch button.active{background:var(--gold);color:#1a1300;border-color:var(--gold);}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:520px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;}
  .stat .num{font-size:24px;font-weight:700;font-family:monospace;}
  .stat .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.03em;margin-top:4px;}
  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .refresh-row .when{font-size:11.5px;color:var(--ink-dim);}
  .logout{color:var(--ink-dim);font-size:12.5px;cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>Suivi <span>d'activité</span> — ESP-GS</h1>
  <div class="logout hidden" id="logoutLink">Déconnexion</div>
</header>

<div id="app">
  <div id="loginBox">
    <p style="font-size:12.5px;color:var(--ink-dim);margin-top:0;">Connectez-vous avec l'identifiant et le mot de passe de votre entreprise pour suivre votre activité, où que vous soyez.</p>
    <label>Identifiant</label>
    <input id="loginUser" autocomplete="username">
    <label>Mot de passe</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <button class="btn-gold" id="btnLogin">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="dashBox" class="hidden">
    <p class="biz-name" id="bizName"></p>
    <p class="biz-status" id="bizStatus"></p>

    <div class="period-switch">
      <button class="active" data-period="daily">Aujourd'hui</button>
      <button data-period="weekly">Cette semaine</button>
      <button data-period="monthly">Ce mois</button>
      <button data-period="annual">Cette année</button>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="refresh-row">
      <span class="when" id="lastRefresh"></span>
      <button id="btnRefresh" style="background:var(--panel2);color:var(--ink);border:1px solid var(--border);">↻ Actualiser</button>
    </div>
  </div>
</div>

<script src="suivi.js"></script>
</body>
</html>
